[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-bot"
version = "3.2.0"
description = "Real-time multi-bot Telegram bridge, live browser takeover, and companion stack for Google Antigravity CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.scripts]
agy-bot = "bridge.cli:main"

[tool.setuptools]
packages = ["bridge"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "venv",
    ".venv",
    "backups",
    "state",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E402"]
