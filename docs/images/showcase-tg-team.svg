  <circle cx="26" cy="24" r="5.5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="46" cy="24" r="5.5" fill="#f59e0b" fill-opacity="0.85"/>
  <circle cx="66" cy="24" r="5.5" fill="#22c55e" fill-opacity="0.85"/>
