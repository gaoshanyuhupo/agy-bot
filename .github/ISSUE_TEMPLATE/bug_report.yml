name: Bug Report
description: Report a bug or unexpected behavior in agy-bot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! **Never include real bot tokens, chat IDs, private domains, or `/home/<user>` paths.**
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands, Telegram actions, or configuration used (redacted).
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted diagnostics (`agy-bot doctor --json`)
      description: Paste sanitized output of `agy-bot doctor --json` (redact any personal paths).
      render: json
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and `agy` CLI version.
      placeholder: "Python 3.12 / Ubuntu 24.04"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Desensitization Confirmation
      options:
        - label: I confirm this report contains zero real tokens, chat IDs, private URLs, or personal usernames.
          required: true
