name: Desensitization, Lint & Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies and Ruff
        run: |
          python3 -m pip install -r bridge/requirements.txt
          python3 -m pip install "ruff>=0.8.0"

      - name: Run Ruff lint gate
        run: ruff check --no-cache .

      - name: Run strict public-release & Git history desensitization audit
        run: python3 scripts/security_audit.py --mode public-release --check-history

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "bridge/requirements.txt"

      - name: Install Python dependencies
        run: python3 -m pip install -r bridge/requirements.txt

      - name: Compile-check Python files
        run: |
          python3 -m py_compile \
            bridge/*.py \
            hooks/*.py \
            mem-hub/*.py \
            scripts/*.py \
            tests/*.py \
            .agents/skills/live-browser/scripts/*.py \
            .agents/skills/continuous-learning-v2/scripts/instinct-cli.py

      - name: Run unit and desensitization test suite
        run: python3 -m unittest discover -s tests -v
