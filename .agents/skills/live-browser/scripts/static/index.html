<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AGY Live Browser · 实时浏览器与人工接管</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1f2630;
      --border: #2d3643;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --green: #238636;
      --green-bright: #3fb950;
      --amber: #d29922;
      --amber-bg: rgba(210, 153, 34, 0.16);
      --danger: #f85149;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
      position: fixed; inset: 0;
    }
    #app {
      display: flex; flex-direction: column;
      width: 100%; height: 100%;
      overflow: hidden;
    }

    /* Auth / Error Overlay */
    #overlay {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center; gap: 12px;
    }
    #overlay.hidden { display: none; }
    .overlay-icon { font-size: 42px; }
    .overlay-title { font-size: 18px; font-weight: 600; }
    .overlay-desc { font-size: 13px; color: var(--muted); max-width: 340px; line-height: 1.5; }

    /* Top Floating Smart Input Sheet (Never covered by iOS Keyboard!) */
    #kb-sheet {
      position: fixed; top: 8px; left: 8px; right: 8px; z-index: 80;
      background: rgba(22, 27, 34, 0.98);
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.78);
      display: flex; flex-direction: column; gap: 8px;
    }
    #kb-sheet.hidden { display: none; }
    .kb-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600; color: #79c0ff;
    }
    #kb-modal-input {
      width: 100%; height: 38px;
      background: #0d1117; border: 1px solid #3d495a; border-radius: 8px;
      color: var(--text); padding: 0 10px; font-size: 15px;
      user-select: text; -webkit-user-select: text;
    }
    .kb-actions {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }

    /* Top Floating Cross-System Clipboard Sheet (To Device Clipboard / Notes / Notepad / TG) */
    #clip-sheet {
      position: fixed; top: 8px; left: 8px; right: 8px; z-index: 85;
      background: rgba(22, 27, 34, 0.99);
      border: 1.5px solid var(--green-bright);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.82);
      display: flex; flex-direction: column; gap: 7px;
    }
    #clip-sheet.hidden { display: none; }
    .clip-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600; color: #56d364; gap: 6px;
    }
    #clip-textarea {
      width: 100%; height: 112px;
      background: #0d1117; border: 1px solid #3d495a; border-radius: 8px;
      color: var(--text); padding: 8px 10px; font-size: 15px; line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      resize: none; user-select: text; -webkit-user-select: text;
    }
    #clip-textarea.expanded {
      height: 52vh; font-size: 16px; line-height: 1.6;
    }
    .clip-hint {
      font-size: 11px; color: #8b949e; line-height: 1.35;
    }
    .btn-copy-primary {
      background: var(--green); border-color: var(--green-bright); color: #fff;
    }
    .btn-copy-slice {
      background: #1f6feb; border-color: #58a6ff; color: #fff;
    }
    #drag-sel-box {
      position: absolute; pointer-events: none; z-index: 25;
      background: rgba(47, 129, 247, 0.24);
      border: 1.5px dashed #58a6ff; border-radius: 3px;
    }
    #live-sel-pill {
      position: absolute; top: 8px; left: 10px; right: 10px; z-index: 35;
      background: rgba(13, 17, 23, 0.96); border: 1.5px solid #58a6ff;
      color: #e6edf3; padding: 7px 11px; border-radius: 10px;
      font-size: 13px; line-height: 1.4; pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      max-height: 76px; overflow: hidden;
    }

    /* Top Control Header */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; gap: 6px;
      background: var(--panel); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .status-group {
      display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .dot.live { background: var(--green-bright); box-shadow: 0 0 8px var(--green-bright); }
    .dot.takeover { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .dot.offline { background: var(--danger); }
    .metrics {
      font-size: 11px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .btn {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      border-radius: 7px; padding: 5px 8px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
      white-space: nowrap; transition: transform 0.08s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn-takeover {
      background: rgba(47, 129, 247, 0.18); border-color: var(--accent); color: #79c0ff;
    }
    .btn-resume {
      background: var(--green); border-color: var(--green-bright); color: #fff;
      animation: pulse-green 1.8s infinite;
    }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.45); }
      50% { box-shadow: 0 0 0 5px rgba(63, 185, 80, 0); }
    }

    /* AI / Takeover Status Banner */
    .banner {
      padding: 5px 10px; font-size: 12px;
      background: #121820; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      flex-shrink: 0;
    }
    .banner.takeover-active {
      background: var(--amber-bg); border-bottom-color: rgba(210, 153, 34, 0.45);
      color: #f2cc60;
    }
    .banner-text {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }

    /* Navigation & Tabs */
    .nav-wrap {
      background: var(--panel); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tabs-bar {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 8px 0 8px; overflow-x: auto; scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 8px; font-size: 11px; border-radius: 6px 6px 0 0;
      background: #11161d; color: var(--muted); border: 1px solid var(--border);
      border-bottom: none; max-width: 140px; cursor: pointer; flex-shrink: 0;
    }
    .tab-pill.active {
      background: var(--panel-2); color: var(--text); font-weight: 600;
    }
    .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-close { opacity: 0.65; font-size: 12px; padding: 0 2px; }
    .url-bar {
      display: flex; align-items: center; gap: 5px; padding: 5px 8px;
    }
    .icon-btn {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      border-radius: 6px; width: 28px; height: 28px; font-size: 13px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .icon-btn:active { background: #2c3543; }
    #url-input {
      flex: 1; min-width: 0; height: 28px;
      background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 0 8px; font-size: 13px;
      user-select: text; -webkit-user-select: text;
    }

    /* Main Interactive Viewport Stage */
    #stage {
      position: relative; flex: 1; min-height: 0;
      background: #07090c; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
    }
    #canvas-wrap {
      position: relative; transform-origin: 0 0;
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.65);
    }
    #screen {
      display: block; background: #0f141a;
      max-width: 100%; max-height: 100%;
    }
    #idle-card {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 20px; text-align: center; background: rgba(13, 17, 23, 0.92);
    }
    #idle-card.hidden { display: none; }

    /* Cursor & Click Ripples */
    .ripple {
      position: absolute; width: 22px; height: 22px; border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      pointer-events: none; animation: ripple-anim 0.55s ease-out forwards;
    }
    .ripple.human { border: 2.5px solid var(--amber); background: rgba(210, 153, 34, 0.25); }
    .ripple.ai { border: 2.5px solid #58a6ff; background: rgba(88, 166, 255, 0.25); }
    .ripple.extract { border: 2.5px solid var(--green-bright); background: rgba(63, 185, 80, 0.30); }
    @keyframes ripple-anim {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.35); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.75); }
    }

    /* Floating Toast */
    #toast {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.94); border: 1px solid var(--border);
      color: var(--text); padding: 6px 12px; border-radius: 999px;
      font-size: 12px; pointer-events: none; opacity: 0;
      transition: opacity 0.2s ease; z-index: 30; white-space: nowrap;
      max-width: 92%; overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; }

    /* Bottom Touch & Keyboard Dock */
    .dock {
      background: var(--panel); border-top: 1px solid var(--border);
      padding: 6px 8px calc(6px + var(--safe-bottom)) 8px;
      display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }
    .quick-row {
      display: flex; align-items: center; gap: 5px;
      overflow-x: auto; scrollbar-width: none;
    }
    .quick-row::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      border-radius: 6px; padding: 4px 8px; font-size: 11px;
      cursor: pointer; flex-shrink: 0; white-space: nowrap;
    }
    .chip.active { border-color: var(--accent); color: #79c0ff; background: rgba(47, 129, 247, 0.16); }
    .input-row {
      display: flex; align-items: center; gap: 5px;
    }
    #text-input {
      flex: 1; min-width: 0; height: 34px;
      background: #0d1117; border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); padding: 0 10px; font-size: 14px;
      user-select: text; -webkit-user-select: text;
    }

    /* Multi-Fingerprint Profile Indicator & Bottom Drawer */
    .profile-badge-btn {
      border: 1px solid var(--border);
      background: rgba(47, 129, 247, 0.12);
      color: #c9d1d9;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      max-width: 52vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .profile-badge-btn.pinned {
      border-color: rgba(210, 153, 34, 0.55);
      background: rgba(210, 153, 34, 0.14);
      color: #f2cc60;
    }
    .idle-profile-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      width: 100%; max-width: 310px;
    }
    #idle-profile-select {
      width: 100%; height: 36px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0 10px; font-size: 13px;
    }
    #profile-backdrop {
      position: fixed; inset: 0; z-index: 88;
      background: rgba(0, 0, 0, 0.62);
    }
    #profile-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      background: var(--panel);
      border-top: 1.5px solid var(--accent);
      border-radius: 16px 16px 0 0;
      padding: 12px 12px calc(14px + var(--safe-bottom)) 12px;
      max-height: 78vh;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 -10px 36px rgba(0, 0, 0, 0.78);
    }
    .profile-sheet-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 14px; font-weight: 600;
    }
    .profile-sheet-warn {
      font-size: 12px; color: #f2cc60;
      background: var(--amber-bg); border: 1px solid rgba(210, 153, 34, 0.4);
      border-radius: 8px; padding: 6px 10px; line-height: 1.4;
    }
    #profile-list {
      overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      max-height: 50vh; padding-right: 2px;
    }
    .profile-card {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .profile-card.active {
      border-color: var(--green-bright);
      background: rgba(35, 134, 54, 0.14);
    }
    .profile-card-top {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .profile-card-name {
      font-size: 13px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .profile-card-tags {
      display: flex; flex-wrap: wrap; gap: 4px; font-size: 11px; color: var(--muted);
    }
    .profile-tag {
      background: #0d1117; border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 6px;
    }
    .profile-sheet-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-top: 4px; border-top: 1px solid var(--border);
    }
    .btn-danger {
      background: rgba(248, 81, 73, 0.16); border-color: var(--danger); color: #ff7b72;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div class="overlay-icon" id="ov-icon">🔐</div>
    <div class="overlay-title" id="ov-title">正在验证 Telegram 安全签名...</div>
    <div class="overlay-desc" id="ov-desc">仅允许已授权的 Telegram 账号在 Mini App 内实时查看与接管浏览器。</div>
  </div>

  <!-- Top Floating Smart Input Sheet (Pops up automatically when tapping webpage inputs, never covered by mobile keyboard) -->
  <div id="kb-sheet" class="hidden">
    <div class="kb-header">
      <span id="kb-sheet-label">⌨️ 向网页输入框打字</span>
      <button class="chip" onclick="closeKbSheet()">关闭 ×</button>
    </div>
    <input id="kb-modal-input" type="text" placeholder="输入中文 / 英文 / 验证码 / 密码..." enterkeyhint="send" autocomplete="off" />
    <div class="kb-actions">
      <button class="btn btn-takeover" style="flex:1;justify-content:center;" onclick="submitKbSheet(true, false)">填入并回车 ↵</button>
      <button class="btn" onclick="submitKbSheet(false, false)">仅填入</button>
      <button class="btn" onclick="submitKbSheet(false, true)">覆盖原内容</button>
      <button class="btn" onclick="sendKey('Backspace')">⌫</button>
    </div>
  </div>

  <!-- Top Floating Cross-System Clipboard & Free Word-Selection Sheet -->
  <div id="clip-sheet" class="hidden">
    <div class="clip-header">
      <span id="clip-sheet-label" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📋 自由选词复制</span>
      <div style="display:flex;gap:5px;flex-shrink:0;">
        <button class="chip" id="expand-clip-btn" onclick="toggleExpandClip()">🔍 放大选词</button>
        <button class="chip" onclick="closeClipSheet()">关闭 ×</button>
      </div>
    </div>
    <div class="quick-row" id="clip-tools-row">
      <button class="chip active" onclick="activatePointExtractFromSheet()">🖊 去画面涂抹选字</button>
      <button class="chip" onclick="requestExtract('page')">📄 载入整页自由划词</button>
      <button class="chip" onclick="requestExtract('url')">🔗 当前网址</button>
      <button class="chip hidden" id="clip-var-primary" onclick="switchClipVariant('primary')">精确词句</button>
      <button class="chip hidden" id="clip-var-block" onclick="switchClipVariant('block')">所在整段</button>
      <button class="chip hidden" id="clip-var-href" onclick="switchClipVariant('href')">链接URL</button>
    </div>
    <div class="clip-hint" id="clip-hint-text">💡 可在下方框内<b>长按拖动光标</b>自由圈选任意几个字（只复制选中部分）：</div>
    <textarea id="clip-textarea" placeholder="点上方【🖊 去画面涂抹选字】用手指划过网页文字；或点【📄 载入整页自由划词】在这里用光标随意节选..."></textarea>
    <div class="kb-actions">
      <button class="btn btn-copy-primary" id="copy-local-btn" style="flex:1;justify-content:center;" onpointerdown="event.preventDefault()" onclick="copyToDeviceClipboard()">📋 复制框内全部</button>
      <button class="btn" id="share-btn" onpointerdown="event.preventDefault()" onclick="shareToOtherApps()" title="调用系统原生分享直达备忘录/记事本/其他应用">📤 备忘录/分享</button>
      <button class="btn" onpointerdown="event.preventDefault()" onclick="downloadAsTxt()" title="保存为 .txt 记事本文件">💾 .txt</button>
      <button class="btn" onpointerdown="event.preventDefault()" onclick="sendClipToTg()" title="发送到当前 Telegram 聊天框">📨 发回TG</button>
    </div>
  </div>

  <div id="app">
    <div class="topbar">
      <div class="status-group">
        <span class="dot" id="conn-dot"></span>
        <span class="metrics" id="metrics-text">连接中...</span>
      </div>
      <button class="btn" id="top-extract-btn" onclick="toggleExtractMode()" title="在网页上用手指涂抹/拖动选定任意文字复制">🖊 选字</button>
      <button class="btn" onclick="openKbSheetManual()" title="弹出顶部输入法面板">⌨️ 打字</button>
      <button class="btn btn-takeover" id="takeover-btn" onclick="toggleTakeover()">🖐 一键接管</button>
    </div>

    <div class="banner" id="mode-banner">
      <span class="banner-text" id="banner-text">👀 观看模式 · 触屏仅缩放浏览，不会打断 AI</span>
      <button class="profile-badge-btn" id="profile-badge" onclick="openProfileSheet()" title="查看或切换浏览器指纹与出口">🎭 默认指纹</button>
      <span id="zoom-badge" style="font-size:11px;color:var(--muted);cursor:pointer;" onclick="resetZoom()">100%</span>
    </div>

    <div class="nav-wrap">
      <div class="tabs-bar" id="tabs-bar"></div>
      <div class="url-bar">
        <button class="icon-btn" title="后退" onclick="sendNav('back')">◀</button>
        <button class="icon-btn" title="前进" onclick="sendNav('forward')">▶</button>
        <button class="icon-btn" title="刷新" onclick="sendNav('reload')">↻</button>
        <input id="url-input" type="text" placeholder="输入网址回车跳转（需先点接管）" enterkeyhint="go" />
        <button class="icon-btn" title="前往" onclick="submitUrl()">↵</button>
      </div>
    </div>

    <div id="stage">
      <div id="canvas-wrap">
        <canvas id="screen" width="1280" height="800"></canvas>
        <div id="drag-sel-box" class="hidden"></div>
      </div>
      <div id="live-sel-pill" class="hidden"></div>
      <div id="idle-card" class="hidden">
        <div style="font-size:34px;">🖥</div>
        <div style="font-size:15px;font-weight:600;">当前没有正在运行的浏览器任务</div>
        <div style="font-size:12px;color:var(--muted);max-width:290px;">
          当 AI 启动浏览器时画面会自动出现；你也可以选择指纹环境后手动拉起浏览器直接操作。
        </div>
        <div class="idle-profile-wrap">
          <select id="idle-profile-select" aria-label="选择浏览器指纹"></select>
          <div style="display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap;">
            <button class="btn btn-takeover" onclick="startBrowserManual()" style="padding:8px 16px;font-size:13px;">
              🚀 立即启动安全浏览器
            </button>
            <button class="btn" onclick="openProfileSheet()" style="padding:8px 12px;font-size:12px;">
              🎭 指纹详情
            </button>
          </div>
        </div>
      </div>
      <div id="toast"></div>
    </div>

    <div class="dock">
      <div class="quick-row">
        <button class="chip active" id="mode-touch-btn" onclick="setGestureMode('interact')">👆 点按+滑屏</button>
        <button class="chip" id="mode-extract-btn" onclick="toggleExtractMode()">🖊 拖选文字</button>
        <button class="chip" onclick="openClipSheetManual()">📋 复制面板</button>
        <button class="chip" id="mode-pan-btn" onclick="setGestureMode('pan')">🔍 拖动画布</button>
        <button class="chip" onclick="resetZoom()">1:1 复位</button>
        <button class="chip" onclick="sendKey('Enter')">↵ Enter</button>
        <button class="chip" onclick="sendKey('Tab')">⇥ Tab</button>
        <button class="chip" onclick="sendKey('Backspace')">⌫ 退格</button>
        <button class="chip" onclick="sendKey('Escape')">Esc</button>
        <button class="chip" onclick="sendScroll(0, -360)">⬆ 上翻</button>
        <button class="chip" onclick="sendScroll(0, 360)">⬇ 下翻</button>
        <button class="chip" onclick="clearField()">清空输入框</button>
      </div>
      <div class="input-row">
        <input id="text-input" type="text" placeholder="点网页输入框会自动弹窗，或直接在此打字发送..." enterkeyhint="send" autocomplete="off" />
        <button class="btn" onclick="sendText(false)">输入</button>
        <button class="btn btn-takeover" onclick="sendText(true)">输入+↵</button>
      </div>
    </div>
  </div>

  <!-- Bottom Multi-Fingerprint Profile Switcher Drawer -->
  <div id="profile-backdrop" class="hidden" onclick="closeProfileSheet()"></div>
  <div id="profile-sheet" class="hidden" role="dialog" aria-label="浏览器多指纹与出口切换">
    <div class="profile-sheet-header">
      <span>🎭 浏览器多指纹与出口环境</span>
      <div style="display:flex;gap:6px;">
        <button class="chip" onclick="refreshProfiles()">🔄 刷新</button>
        <button class="chip" onclick="closeProfileSheet()">关闭 ×</button>
      </div>
    </div>
    <div id="profile-sheet-warn" class="profile-sheet-warn hidden"></div>
    <div id="profile-list"></div>
    <div class="profile-sheet-footer">
      <button class="btn btn-danger hidden" id="stop-browser-btn" onclick="stopBrowserManual()">⏹ 关闭浏览器</button>
      <span style="font-size:11px;color:var(--muted);margin-left:auto;">🔒 Pinned 指纹强制直连且不可修改代理</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
      } catch (_) {}
    }

    const appEl = document.getElementById('app');
    const screenCanvas = document.getElementById('screen');
    const ctx = screenCanvas.getContext('2d', { alpha: false });
    const stage = document.getElementById('stage');
    const canvasWrap = document.getElementById('canvas-wrap');

    // Keep #app sized strictly above iOS / Android virtual keyboard!
    function syncViewportHeight() {
      const vv = window.visualViewport;
      if (vv) {
        appEl.style.height = Math.round(vv.height) + 'px';
        window.scrollTo(0, 0);
      } else {
        appEl.style.height = window.innerHeight + 'px';
      }
      fitCanvasLayout();
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewportHeight);
      window.visualViewport.addEventListener('scroll', syncViewportHeight);
    }
    window.addEventListener('resize', syncViewportHeight);

    let ws = null;
    let authed = false;
    let state = {
      running: false,
      engine_mode: 'idle',
      profile: null,
      pinned: false,
      egress: 'direct',
      os: '',
      ai_busy: false,
      takeover: false,
      takeover_reason: '',
      ai_status: '',
      url: '',
      title: '',
      vw: 1280,
      vh: 800,
      tabs: [],
      profiles: []
    };

    let frameCount = 0;
    let currentFps = 0;
    let rttMs = 0;
    let lastFpsTick = performance.now();

    let scale = 1.0;
    let panX = 0;
    let panY = 0;
    let gestureMode = 'interact';

    function haptic(kind = 'light') {
      try { tg?.HapticFeedback?.impactOccurred(kind); } catch (_) {}
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function fitCanvasLayout() {
      const sw = stage.clientWidth;
      const sh = stage.clientHeight;
      const iw = screenCanvas.width || 1280;
      const ih = screenCanvas.height || 800;
      const baseRatio = Math.min(sw / iw, sh / ih);
      const dispW = Math.max(1, Math.floor(iw * baseRatio));
      const dispH = Math.max(1, Math.floor(ih * baseRatio));
      screenCanvas.style.width = dispW + 'px';
      screenCanvas.style.height = dispH + 'px';
      applyTransform();
    }

    function applyTransform() {
      if (scale <= 1.01) {
        scale = 1.0; panX = 0; panY = 0;
      }
      canvasWrap.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      document.getElementById('zoom-badge').textContent = Math.round(scale * 100) + '%';
    }

    function resetZoom() {
      scale = 1.0; panX = 0; panY = 0;
      applyTransform();
    }

    function setGestureMode(mode) {
      gestureMode = mode;
      document.getElementById('mode-touch-btn').classList.toggle('active', mode === 'interact');
      document.getElementById('mode-extract-btn').classList.toggle('active', mode === 'extract');
      document.getElementById('mode-pan-btn').classList.toggle('active', mode === 'pan');
      const topBtn = document.getElementById('top-extract-btn');
      if (topBtn) {
        topBtn.classList.toggle('btn-takeover', mode === 'extract');
        topBtn.textContent = mode === 'extract' ? '🖊 选字中' : '🖊 选字';
      }
      if (mode === 'extract') {
        closeClipSheet();
        showToast('🖊 直接在文字上按住拖动即可涂抹选词（或轻点单段）');
      } else {
        document.getElementById('drag-sel-box').classList.add('hidden');
        document.getElementById('live-sel-pill').classList.add('hidden');
      }
    }

    function toggleExtractMode() {
      haptic('light');
      setGestureMode(gestureMode === 'extract' ? 'interact' : 'extract');
    }

    // Cross-System Clipboard & Free Word-Selection Sheet
    let lastClipVariants = { primary: '', block: '', href: '' };
    let lockedSelectionText = '';

    function refreshCopyButtonLabel() {
      const ta = document.getElementById('clip-textarea');
      const copyBtn = document.getElementById('copy-local-btn');
      const hintEl = document.getElementById('clip-hint-text');
      if (lockedSelectionText && lockedSelectionText.length > 0) {
        copyBtn.className = 'btn btn-copy-slice';
        copyBtn.textContent = `✂️ 仅复制选中的 ${lockedSelectionText.length} 个字`;
        hintEl.innerHTML = `✅ 已圈选 <b>${lockedSelectionText.length}</b> 个字，点下方蓝按钮仅复制这部分（点空白处恢复全选）：`;
      } else {
        copyBtn.className = 'btn btn-copy-primary';
        const total = (ta.value || '').length;
        copyBtn.textContent = total > 0 ? `📋 复制框内全部 (${total}字)` : '📋 复制到本机剪贴板';
        hintEl.innerHTML = '💡 可在下方框内<b>长按拖动蓝标</b>自由圈选任意几个字（只复制选中部分）：';
      }
    }

    function syncClipSelectionFromTextarea() {
      const ta = document.getElementById('clip-textarea');
      if (!ta || document.getElementById('clip-sheet').classList.contains('hidden')) return;
      if (document.activeElement === ta) {
        if (ta.selectionStart !== ta.selectionEnd) {
          lockedSelectionText = ta.value.substring(ta.selectionStart, ta.selectionEnd);
        } else {
          lockedSelectionText = '';
        }
        refreshCopyButtonLabel();
      }
    }

    document.addEventListener('selectionchange', syncClipSelectionFromTextarea);
    const clipTaEl = document.getElementById('clip-textarea');
    clipTaEl.addEventListener('select', syncClipSelectionFromTextarea);
    clipTaEl.addEventListener('keyup', syncClipSelectionFromTextarea);
    clipTaEl.addEventListener('mouseup', syncClipSelectionFromTextarea);
    clipTaEl.addEventListener('touchend', () => setTimeout(syncClipSelectionFromTextarea, 50));
    clipTaEl.addEventListener('input', () => { lockedSelectionText = ''; refreshCopyButtonLabel(); });

    function toggleExpandClip() {
      const ta = document.getElementById('clip-textarea');
      const btn = document.getElementById('expand-clip-btn');
      const exp = ta.classList.toggle('expanded');
      btn.textContent = exp ? '🔽 收起框' : '🔍 放大选词';
    }

    function openClipSheet(data) {
      closeKbSheet();
      const sheet = document.getElementById('clip-sheet');
      const ta = document.getElementById('clip-textarea');
      const lbl = document.getElementById('clip-sheet-label');
      lockedSelectionText = '';

      if (data) {
        lbl.textContent = `📋 ${data.source || '自由选词复制'}`;
        ta.value = data.text || '';
        lastClipVariants = {
          primary: data.text || '',
          block: data.blockText || '',
          href: data.href || ''
        };
        document.getElementById('clip-var-primary').classList.toggle('hidden', !(data.blockText || data.href));
        document.getElementById('clip-var-block').classList.toggle('hidden', !data.blockText);
        document.getElementById('clip-var-href').classList.toggle('hidden', !data.href);
      }
      refreshCopyButtonLabel();
      sheet.classList.remove('hidden');
    }

    function openClipSheetManual() {
      haptic('light');
      openClipSheet(null);
      if (ws && ws.readyState === WebSocket.OPEN && authed) {
        ws.send(JSON.stringify({ type: 'read_clipboard' }));
      }
    }

    function closeClipSheet() {
      const ta = document.getElementById('clip-textarea');
      ta.blur();
      lockedSelectionText = '';
      document.getElementById('clip-sheet').classList.add('hidden');
    }

    function switchClipVariant(kind) {
      haptic('light');
      const ta = document.getElementById('clip-textarea');
      if (lastClipVariants[kind]) {
        ta.value = lastClipVariants[kind];
        lockedSelectionText = '';
        refreshCopyButtonLabel();
      }
    }

    function activatePointExtractFromSheet() {
      closeClipSheet();
      setGestureMode('extract');
    }

    function requestExtract(mode) {
      if (!state.running) {
        showToast('浏览器尚未运行');
        return;
      }
      haptic('light');
      if (ws && ws.readyState === WebSocket.OPEN && authed) {
        ws.send(JSON.stringify({ type: 'extract', mode }));
      }
    }

    function getActiveClipText() {
      const ta = document.getElementById('clip-textarea');
      if (ta.selectionStart !== ta.selectionEnd) {
        return ta.value.substring(ta.selectionStart, ta.selectionEnd);
      }
      if (lockedSelectionText && lockedSelectionText.length > 0) {
        return lockedSelectionText;
      }
      return ta.value || '';
    }

    function writeSystemClipboardSyncAndAsync(text) {
      let ok = false;
      try {
        const tmp = document.createElement('textarea');
        tmp.value = text;
        tmp.setAttribute('readonly', '');
        tmp.style.position = 'fixed';
        tmp.style.top = '-9999px';
        tmp.style.left = '-9999px';
        tmp.style.fontSize = '16px';
        tmp.style.opacity = '0';
        document.body.appendChild(tmp);
        tmp.focus();
        tmp.select();
        tmp.setSelectionRange(0, text.length);
        ok = document.execCommand('copy');
        document.body.removeChild(tmp);
      } catch (_) {}

      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(text).catch(() => {});
        ok = true;
      }
      return ok;
    }

    function copyToDeviceClipboard() {
      const isSlice = !!(lockedSelectionText && lockedSelectionText.length > 0);
      const text = getActiveClipText();
      if (!text) {
        showToast('当前没有可复制的内容，可先点【🖊 去画面涂抹选字】');
        return;
      }
      writeSystemClipboardSyncAndAsync(text);
      try { tg?.HapticFeedback?.notificationOccurred?.('success'); } catch (_) { haptic('medium'); }
      const btn = document.getElementById('copy-local-btn');
      btn.textContent = isSlice
        ? `✅ 已复制选中的 ${text.length} 字！去记事本粘贴`
        : `✅ 已复制 (${text.length}字)！去记事本粘贴`;
      showToast(`✅ 已写入本机剪贴板（${text.length}字），切去备忘录/记事本粘贴即可`);
    }

    async function shareToOtherApps() {
      const text = getActiveClipText();
      if (!text) {
        showToast('当前没有可分享的内容');
        return;
      }
      haptic('light');
      if (navigator.share) {
        try {
          await navigator.share({ text });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      // Fallback on desktop WebViews without navigator.share: save as .txt for Notepad
      downloadAsTxt();
    }

    function downloadAsTxt() {
      const text = getActiveClipText();
      if (!text) {
        showToast('当前没有可保存的内容');
        return;
      }
      haptic('light');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `browser-note-${stamp}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      showToast('💾 已生成 .txt 文本文件');
    }

    function sendClipToTg() {
      const text = getActiveClipText();
      if (!text) {
        showToast('当前没有可发送的内容');
        return;
      }
      if (ws && ws.readyState === WebSocket.OPEN && authed) {
        haptic('light');
        ws.send(JSON.stringify({ type: 'send_to_tg', text }));
      }
    }

    // Smart Top Input Sheet
    function openKbSheet(info) {
      closeClipSheet();
      const sheet = document.getElementById('kb-sheet');
      const inp = document.getElementById('kb-modal-input');
      const lbl = document.getElementById('kb-sheet-label');
      lbl.textContent = `⌨️ 网页输入框：${(info && info.label) ? info.label.slice(0, 28) : '当前焦点框'}`;
      inp.type = (info && info.isPassword) ? 'password' : 'text';
      inp.value = (info && info.value) ? info.value : '';
      sheet.classList.remove('hidden');
      setTimeout(() => inp.focus(), 30);
    }

    function openKbSheetManual() {
      if (!ensureTakeoverOrWarn()) return;
      openKbSheet({ label: '当前网页焦点位置', value: '', isPassword: false });
    }

    function closeKbSheet() {
      const sheet = document.getElementById('kb-sheet');
      const inp = document.getElementById('kb-modal-input');
      inp.blur();
      sheet.classList.add('hidden');
    }

    function submitKbSheet(submitEnter, replaceExisting) {
      if (!ensureTakeoverOrWarn()) return;
      const inp = document.getElementById('kb-modal-input');
      const text = inp.value;
      haptic('light');
      ws.send(JSON.stringify({
        type: 'input',
        action: 'type',
        text,
        submit: !!submitEnter,
        replace: !!replaceExisting
      }));
      inp.value = '';
      if (submitEnter) closeKbSheet();
    }

    document.getElementById('kb-modal-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitKbSheet(true, false); }
      if (e.key === 'Escape') { e.preventDefault(); closeKbSheet(); }
    });

    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws`);
      ws.binaryType = 'blob';

      ws.onopen = () => {
        const initData = (tg && tg.initData) ? tg.initData : '';
        ws.send(JSON.stringify({ type: 'auth', initData }));
      };

      ws.onmessage = async (ev) => {
        if (typeof ev.data === 'string') {
          const msg = JSON.parse(ev.data);
          handleJsonMessage(msg);
        } else if (ev.data instanceof Blob) {
          frameCount++;
          try {
            if (window.createImageBitmap) {
              const bmp = await createImageBitmap(ev.data);
              if (screenCanvas.width !== bmp.width || screenCanvas.height !== bmp.height) {
                screenCanvas.width = bmp.width;
                screenCanvas.height = bmp.height;
                fitCanvasLayout();
              }
              ctx.drawImage(bmp, 0, 0);
              bmp.close();
            } else {
              const url = URL.createObjectURL(ev.data);
              const img = new Image();
              img.onload = () => {
                if (screenCanvas.width !== img.naturalWidth || screenCanvas.height !== img.naturalHeight) {
                  screenCanvas.width = img.naturalWidth;
                  screenCanvas.height = img.naturalHeight;
                  fitCanvasLayout();
                }
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
              };
              img.src = url;
            }
          } catch (_) {}
        }
      };

      ws.onclose = () => {
        document.getElementById('conn-dot').className = 'dot offline';
        document.getElementById('metrics-text').textContent = '连接已断开，重连中...';
        if (authed) {
          setTimeout(connectWs, 1500);
        }
      };
    }

    function handleJsonMessage(msg) {
      if (msg.type === 'auth_ok') {
        authed = true;
        document.getElementById('overlay').classList.add('hidden');
        syncViewportHeight();
        updateMetricsUi();
        refreshProfiles();
        return;
      }
      if (msg.type === 'auth_error') {
        authed = false;
        const ov = document.getElementById('overlay');
        ov.classList.remove('hidden');
        document.getElementById('ov-icon').textContent = '⛔';
        document.getElementById('ov-title').textContent = '403 Forbidden · 拒绝访问';
        document.getElementById('ov-desc').textContent = msg.error || '请从你本人的授权 Telegram 机器人对话内点击【实时画面 / 人工接管】按钮打开。';
        if (ws) ws.close();
        return;
      }
      if (msg.type === 'pong') {
        rttMs = Math.max(1, Math.round(Date.now() - msg.t));
        updateMetricsUi();
        return;
      }
      if (msg.type === 'toast') {
        showToast(msg.message);
        return;
      }
      if (msg.type === 'profiles_list') {
        state = {
          ...state,
          profile: msg.active_profile !== undefined ? msg.active_profile : state.profile,
          pinned: msg.pinned !== undefined ? !!msg.pinned : state.pinned,
          running: msg.running !== undefined ? !!msg.running : state.running,
          ai_busy: msg.ai_busy !== undefined ? !!msg.ai_busy : state.ai_busy,
          takeover: msg.takeover !== undefined ? !!msg.takeover : state.takeover,
          profiles: Array.isArray(msg.profiles) ? msg.profiles : state.profiles
        };
        renderProfilesUi();
        return;
      }
      if (msg.type === 'input_focused') {
        if (state.takeover && gestureMode !== 'extract') {
          haptic('light');
          openKbSheet(msg);
        }
        return;
      }
      if (msg.type === 'selection_preview') {
        const pill = document.getElementById('live-sel-pill');
        if (gestureMode === 'extract' && msg.text) {
          pill.textContent = `🖊 已涂抹选中 (${msg.text.length}字)：${msg.text.slice(0, 90)}`;
          pill.classList.remove('hidden');
        }
        return;
      }
      if (msg.type === 'clipboard') {
        document.getElementById('drag-sel-box').classList.add('hidden');
        document.getElementById('live-sel-pill').classList.add('hidden');
        try { tg?.HapticFeedback?.notificationOccurred?.('success'); } catch (_) { haptic('medium'); }
        if (gestureMode === 'extract') {
          setGestureMode('interact');
        }
        openClipSheet(msg);
        return;
      }
      if (msg.type === 'state') {
        const prevUrl = state.url;
        state = { ...state, ...msg };
        renderState(prevUrl !== state.url);
      }
    }

    function renderState(urlChanged) {
      const dot = document.getElementById('conn-dot');
      const btn = document.getElementById('takeover-btn');
      const banner = document.getElementById('mode-banner');
      const bannerText = document.getElementById('banner-text');
      const idleCard = document.getElementById('idle-card');

      idleCard.classList.toggle('hidden', !!state.running);

      if (!state.running) {
        dot.className = 'dot';
      } else if (state.takeover) {
        dot.className = 'dot takeover';
      } else {
        dot.className = 'dot live';
      }

      if (state.takeover) {
        btn.className = 'btn btn-resume';
        btn.textContent = '▶️ 交还给 AI';
        banner.classList.add('takeover-active');
        bannerText.textContent = state.takeover_reason
          ? `🖐 接管中：${state.takeover_reason}`
          : '🖐 接管中 · 点网页输入框自动弹窗打字，或点右上角【⌨️ 打字】';
      } else {
        btn.className = 'btn btn-takeover';
        btn.textContent = '🖐 一键接管';
        banner.classList.remove('takeover-active');
        closeKbSheet();
        bannerText.textContent = state.ai_status
          ? `🤖 ${state.ai_status}`
          : '👀 观看模式 · 点右上角【一键接管】即可暂停 AI 并手动操作';
      }

      const urlInput = document.getElementById('url-input');
      if (urlChanged && document.activeElement !== urlInput) {
        urlInput.value = state.url || '';
      }

      const tabsBar = document.getElementById('tabs-bar');
      tabsBar.innerHTML = '';
      (state.tabs || []).forEach((t) => {
        const pill = document.createElement('div');
        pill.className = 'tab-pill' + (t.active ? ' active' : '');
        const titleSpan = document.createElement('span');
        titleSpan.className = 'tab-title';
        titleSpan.textContent = t.title || t.url || `Tab ${t.index + 1}`;
        pill.onclick = () => sendInput({ action: 'switch_tab', index: t.index });
        pill.appendChild(titleSpan);
        if ((state.tabs || []).length > 1) {
          const closeBtn = document.createElement('span');
          closeBtn.className = 'tab-close';
          closeBtn.textContent = '×';
          closeBtn.onclick = (e) => {
            e.stopPropagation();
            sendInput({ action: 'close_tab', index: t.index });
          };
          pill.appendChild(closeBtn);
        }
        tabsBar.appendChild(pill);
      });
      if (state.running) {
        const addBtn = document.createElement('div');
        addBtn.className = 'tab-pill';
        addBtn.textContent = '+';
        addBtn.onclick = () => sendInput({ action: 'new_tab' });
        tabsBar.appendChild(addBtn);
      }

      if (state.cursor && state.cursor.ts) {
        showRemoteCursor(state.cursor);
      }
      renderProfilesUi();
      updateMetricsUi();
    }

    function formatProfileSummary(p) {
      if (!p) return '默认指纹';
      const lock = p.pinned ? '🔒 ' : '';
      const osName = p.os || 'windows';
      const egress = p.egress_display || p.egress || 'direct';
      return `${lock}${p.name} · ${osName} · ${egress}`;
    }

    function renderProfilesUi() {
      const profiles = Array.isArray(state.profiles) ? state.profiles : [];
      const badge = document.getElementById('profile-badge');
      if (badge) {
        const activeObj = profiles.find((p) => p.active || (state.profile && p.name === state.profile));
        if (state.running && state.profile) {
          const lock = state.pinned ? '🔒 ' : '🎭 ';
          const osPart = state.os || (activeObj && activeObj.os) || 'windows';
          const egressPart = state.egress || (activeObj && (activeObj.egress_display || activeObj.egress)) || 'direct';
          badge.textContent = `${lock}${state.profile} · ${osPart} · ${egressPart}`;
          badge.classList.toggle('pinned', !!state.pinned);
        } else if (activeObj) {
          badge.textContent = `${activeObj.pinned ? '🔒 ' : '🎭 '}${formatProfileSummary(activeObj)}`;
          badge.classList.toggle('pinned', !!activeObj.pinned);
        } else if (profiles.length > 0) {
          const first = profiles[0];
          badge.textContent = `${first.pinned ? '🔒 ' : '🎭 '}${formatProfileSummary(first)}`;
          badge.classList.toggle('pinned', !!first.pinned);
        } else {
          badge.textContent = '🎭 默认指纹';
          badge.classList.remove('pinned');
        }
      }

      const sel = document.getElementById('idle-profile-select');
      if (sel) {
        const prevVal = sel.value;
        sel.innerHTML = '';
        if (profiles.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = '🎭 默认浏览器指纹';
          sel.appendChild(opt);
        } else {
          profiles.forEach((p) => {
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.textContent = formatProfileSummary(p);
            sel.appendChild(opt);
          });
          if (prevVal && profiles.some((p) => p.name === prevVal)) {
            sel.value = prevVal;
          } else if (state.profile && profiles.some((p) => p.name === state.profile)) {
            sel.value = state.profile;
          }
        }
      }

      const stopBtn = document.getElementById('stop-browser-btn');
      if (stopBtn) {
        stopBtn.classList.toggle('hidden', !(state.running && state.engine_mode === 'async_hosted'));
      }

      const warnEl = document.getElementById('profile-sheet-warn');
      if (warnEl) {
        if (state.engine_mode === 'sync_external') {
          warnEl.textContent = '⚠️ 当前由外部脚本控制浏览器，暂不支持切换指纹或从面板停止。';
          warnEl.classList.remove('hidden');
        } else if (state.takeover) {
          warnEl.textContent = '⚠️ 当前处于人工接管中：切换指纹前请先点击【▶️ 交还给 AI】或先【⏹ 关闭浏览器】。';
          warnEl.classList.remove('hidden');
        } else if (state.ai_busy) {
          warnEl.textContent = '⏳ AI 正在执行浏览器操作，请等待当前步骤完成后再切换或关闭。';
          warnEl.classList.remove('hidden');
        } else {
          warnEl.classList.add('hidden');
        }
      }

      const sheet = document.getElementById('profile-sheet');
      const listEl = document.getElementById('profile-list');
      if (!listEl || !sheet) return;
      listEl.innerHTML = '';
      if (profiles.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'font-size:12px;color:var(--muted);padding:12px;text-align:center;';
        empty.textContent = '暂无已加载的指纹配置，可点击右上角【🔄 刷新】。';
        listEl.appendChild(empty);
        return;
      }

      profiles.forEach((p) => {
        const isCurrent = !!state.running && ((state.profile && p.name === state.profile) || !!p.active);
        const card = document.createElement('div');
        card.className = 'profile-card' + (isCurrent ? ' active' : '');

        const top = document.createElement('div');
        top.className = 'profile-card-top';

        const nameEl = document.createElement('div');
        nameEl.className = 'profile-card-name';
        nameEl.textContent = `${p.pinned ? '🔒 ' : '🎭 '}${p.name}`;
        top.appendChild(nameEl);

        const actionBtn = document.createElement('button');
        actionBtn.className = isCurrent ? 'btn' : 'btn btn-takeover';
        if (isCurrent) {
          actionBtn.textContent = '🟢 运行中';
          actionBtn.disabled = true;
          actionBtn.style.opacity = '0.8';
        } else {
          actionBtn.textContent = state.running ? '🔄 切换并启动' : '🚀 使用并启动';
          actionBtn.onclick = () => switchProfile(p.name);
        }
        top.appendChild(actionBtn);
        card.appendChild(top);

        const tags = document.createElement('div');
        tags.className = 'profile-card-tags';
        const modeTag = p.pinned ? '🔒 Pinned' : (p.persistent === false ? '💨 Ephemeral' : '💾 Persistent');
        const tagTexts = [
          modeTag,
          `💻 ${p.os || 'windows'}`,
          `🌐 ${p.egress_display || p.egress || 'direct'}`
        ];
        if (p.locale) tagTexts.push(`🗣 ${p.locale}`);
        if (Array.isArray(p.window) && p.window.length === 2) tagTexts.push(`📐 ${p.window[0]}x${p.window[1]}`);
        if (p.geoip) tagTexts.push(`📍 GeoIP`);
        if (p.block_webrtc) tagTexts.push(`🛡 No-WebRTC`);

        tagTexts.forEach((txt) => {
          const sp = document.createElement('span');
          sp.className = 'profile-tag';
          sp.textContent = txt;
          tags.appendChild(sp);
        });
        card.appendChild(tags);
        listEl.appendChild(card);
      });
    }

    function openProfileSheet() {
      haptic('light');
      closeClipSheet();
      closeKbSheet();
      renderProfilesUi();
      document.getElementById('profile-backdrop').classList.remove('hidden');
      document.getElementById('profile-sheet').classList.remove('hidden');
      refreshProfiles();
    }

    function closeProfileSheet() {
      document.getElementById('profile-backdrop').classList.add('hidden');
      document.getElementById('profile-sheet').classList.add('hidden');
    }

    function refreshProfiles() {
      if (ws && ws.readyState === WebSocket.OPEN && authed) {
        ws.send(JSON.stringify({ type: 'list_profiles' }));
      }
    }

    function switchProfile(profileName) {
      if (!ws || ws.readyState !== WebSocket.OPEN || !authed) return;
      if (state.engine_mode === 'sync_external') {
        showToast('外部脚本联动中，暂不支持切换指纹');
        return;
      }
      if (state.takeover) {
        showToast('请先点击右上角【▶️ 交还给 AI】或先【⏹ 关闭浏览器】再切换');
        haptic('medium');
        return;
      }
      if (state.ai_busy) {
        showToast('AI 正在操作浏览器，请稍候再切换');
        return;
      }
      haptic('medium');
      showToast(`🔄 正在切换至指纹 ${profileName}...`);
      ws.send(JSON.stringify({
        type: 'switch_profile',
        profile: profileName,
        url: state.url || 'https://www.google.com',
        takeover: !state.running
      }));
      closeProfileSheet();
    }

    function stopBrowserManual() {
      if (!ws || ws.readyState !== WebSocket.OPEN || !authed) return;
      if (state.engine_mode !== 'async_hosted') {
        showToast('当前没有可关闭的托管浏览器');
        return;
      }
      if (state.ai_busy) {
        showToast('AI 正在执行浏览器操作，请等待当前步骤完成后再关闭');
        return;
      }
      haptic('medium');
      showToast('⏹ 正在安全关闭浏览器...');
      ws.send(JSON.stringify({ type: 'stop_browser' }));
      closeProfileSheet();
    }

    let lastCursorTs = 0;
    function showRemoteCursor(c) {
      if (!c || c.ts === lastCursorTs) return;
      lastCursorTs = c.ts;
      const rx = (c.x || 0) / Math.max(1, state.vw || 1280);
      const ry = (c.y || 0) / Math.max(1, state.vh || 800);
      spawnRipple(rx * screenCanvas.clientWidth, ry * screenCanvas.clientHeight, c.actor === 'human' ? 'human' : 'ai');
    }

    function spawnRipple(localX, localY, cls) {
      const r = document.createElement('div');
      r.className = 'ripple ' + cls;
      r.style.left = localX + 'px';
      r.style.top = localY + 'px';
      canvasWrap.appendChild(r);
      setTimeout(() => r.remove(), 600);
    }

    function updateMetricsUi() {
      const modeMap = { idle: '空闲', async_hosted: '实时守护', sync_external: '脚本联动' };
      const m = modeMap[state.engine_mode] || state.engine_mode;
      document.getElementById('metrics-text').textContent = state.running
        ? `${m} · ${currentFps} FPS · ${rttMs || '--'}ms`
        : `待机中 · ${rttMs || '--'}ms`;
    }

    setInterval(() => {
      const now = performance.now();
      const dt = (now - lastFpsTick) / 1000;
      currentFps = Math.round(frameCount / Math.max(0.1, dt));
      frameCount = 0;
      lastFpsTick = now;
      if (ws && ws.readyState === WebSocket.OPEN && authed) {
        ws.send(JSON.stringify({ type: 'ping', t: Date.now() }));
      }
      updateMetricsUi();
    }, 1500);

    function ensureTakeoverOrWarn() {
      if (!state.running) {
        showToast('浏览器尚未运行，可点击中间按钮启动');
        return false;
      }
      if (!state.takeover) {
        showToast('当前为观看模式，请先点右上角【🖐 一键接管】');
        haptic('medium');
        return false;
      }
      return true;
    }

    function toggleTakeover() {
      if (!ws || ws.readyState !== WebSocket.OPEN || !authed) return;
      haptic('medium');
      ws.send(JSON.stringify({ type: 'set_takeover', active: !state.takeover }));
    }

    function startBrowserManual() {
      if (!ws || ws.readyState !== WebSocket.OPEN || !authed) return;
      haptic('medium');
      const sel = document.getElementById('idle-profile-select');
      const chosenProfile = sel && sel.value ? sel.value : null;
      showToast(chosenProfile ? `正在启动指纹 ${chosenProfile}...` : '正在启动安全浏览器...');
      ws.send(JSON.stringify({
        type: 'start_browser',
        url: 'https://www.google.com',
        profile: chosenProfile,
        takeover: true
      }));
    }

    function sendInput(payload) {
      if (!ensureTakeoverOrWarn()) return;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', ...payload }));
      }
    }

    function sendNav(action) { sendInput({ action }); }

    function submitUrl() {
      const raw = document.getElementById('url-input').value.trim();
      if (!raw) return;
      const url = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
      sendInput({ action: 'goto', url });
      document.getElementById('url-input').blur();
    }

    document.getElementById('url-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitUrl(); }
    });

    function sendText(submitEnter) {
      const el = document.getElementById('text-input');
      const text = el.value;
      if (!text && !submitEnter) return;
      if (!ensureTakeoverOrWarn()) return;
      haptic('light');
      ws.send(JSON.stringify({ type: 'input', action: 'type', text, submit: !!submitEnter }));
      el.value = '';
    }

    document.getElementById('text-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendText(true); }
    });

    function sendKey(key) {
      haptic('light');
      sendInput({ action: 'press', key });
    }

    function clearField() {
      haptic('light');
      sendInput({ action: 'clear_field' });
    }

    function sendScroll(dx, dy) {
      sendInput({ action: 'wheel', dx, dy });
    }

    // Direct physical keyboard pass-through when no local <input> is focused (Desktop / iPad keyboard)
    window.addEventListener('keydown', (e) => {
      const tag = (document.activeElement && document.activeElement.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (!state.running || !state.takeover || !ws || ws.readyState !== WebSocket.OPEN) return;
      if (e.metaKey || e.ctrlKey || e.altKey) {
        if ((e.ctrlKey || e.metaKey) && !e.altKey) {
          const k = (e.key || '').toLowerCase();
          if (k === 'c') {
            e.preventDefault();
            ws.send(JSON.stringify({ type: 'input', action: 'press', key: 'Control+c' }));
            showToast('📋 正在从远程浏览器复制选中内容...');
          } else if (k === 'a') {
            e.preventDefault();
            ws.send(JSON.stringify({ type: 'input', action: 'press', key: 'Control+a' }));
          }
        }
        return;
      }

      const specialKeys = [
        'Enter', 'Backspace', 'Tab', 'Escape', 'Delete',
        'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'
      ];
      if (specialKeys.includes(e.key)) {
        e.preventDefault();
        ws.send(JSON.stringify({ type: 'input', action: 'press', key: e.key }));
      } else if (e.key.length === 1) {
        e.preventDefault();
        ws.send(JSON.stringify({ type: 'input', action: 'type', text: e.key, submit: false }));
      }
    });

    window.addEventListener('paste', (e) => {
      const tag = (document.activeElement && document.activeElement.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (!state.running || !state.takeover || !ws || ws.readyState !== WebSocket.OPEN) return;
      const pasted = (e.clipboardData || window.clipboardData)?.getData('text');
      if (pasted) {
        e.preventDefault();
        ws.send(JSON.stringify({ type: 'input', action: 'type', text: pasted, submit: false }));
        showToast('已粘贴文字到网页焦点框');
      }
    });

    // Touch / Mouse Coordinate Mapping & Pinch-Zoom + Scroll Handling
    function clientToRemoteCoords(clientX, clientY) {
      const rect = screenCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      const rx = (clientX - rect.left) / rect.width;
      const ry = (clientY - rect.top) / rect.height;
      if (rx < 0 || rx > 1 || ry < 0 || ry > 1) return null;
      const localX = rx * screenCanvas.clientWidth;
      const localY = ry * screenCanvas.clientHeight;
      return {
        x: Math.round(rx * (state.vw || 1280) * 10) / 10,
        y: Math.round(ry * (state.vh || 800) * 10) / 10,
        localX,
        localY
      };
    }

    let pointers = new Map();
    let gestureStart = null;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let lastWheelSent = 0;
    let lastPreviewSent = 0;
    let lastTapTime = 0;

    stage.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#idle-card')) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      stage.setPointerCapture(e.pointerId);

      if (pointers.size === 1) {
        const startRemote = clientToRemoteCoords(e.clientX, e.clientY);
        gestureStart = {
          x: e.clientX, y: e.clientY,
          lastX: e.clientX, lastY: e.clientY,
          startRemote,
          panX, panY, moved: false, t: Date.now()
        };
      } else if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinchStartScale = scale;
        if (gestureStart) gestureStart.moved = true;
        document.getElementById('drag-sel-box').classList.add('hidden');
        document.getElementById('live-sel-pill').classList.add('hidden');
      }
    });

    stage.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (pinchStartDist > 10) {
          scale = Math.min(3.5, Math.max(1.0, pinchStartScale * (dist / pinchStartDist)));
          applyTransform();
        }
        return;
      }

      if (pointers.size === 1 && gestureStart) {
        const dxTotal = e.clientX - gestureStart.x;
        const dyTotal = e.clientY - gestureStart.y;
        if (Math.hypot(dxTotal, dyTotal) > 7) gestureStart.moved = true;
        if (!gestureStart.moved) return;

        // Drag-to-select characters directly on webpage when in 'extract' mode!
        if (gestureMode === 'extract' && state.running && gestureStart.startRemote) {
          const curPt = clientToRemoteCoords(e.clientX, e.clientY);
          if (curPt) {
            const box = document.getElementById('drag-sel-box');
            const left = Math.min(gestureStart.startRemote.localX, curPt.localX);
            const top = Math.min(gestureStart.startRemote.localY, curPt.localY);
            const width = Math.max(4, Math.abs(curPt.localX - gestureStart.startRemote.localX));
            const height = Math.max(14, Math.abs(curPt.localY - gestureStart.startRemote.localY));
            box.style.left = left + 'px';
            box.style.top = (top - 4) + 'px';
            box.style.width = width + 'px';
            box.style.height = (height + 8) + 'px';
            box.classList.remove('hidden');

            const now = Date.now();
            if (now - lastPreviewSent >= 95 && ws && ws.readyState === WebSocket.OPEN) {
              lastPreviewSent = now;
              ws.send(JSON.stringify({
                type: 'extract',
                mode: 'range_preview',
                x1: gestureStart.startRemote.x,
                y1: gestureStart.startRemote.y,
                x2: curPt.x,
                y2: curPt.y
              }));
            }
          }
          return;
        }

        if (gestureMode === 'pan' || (!state.takeover && scale > 1.01)) {
          panX = gestureStart.panX + dxTotal;
          panY = gestureStart.panY + dyTotal;
          applyTransform();
        } else if (state.takeover && state.running) {
          const now = Date.now();
          if (now - lastWheelSent >= 45) {
            const stepX = gestureStart.lastX - e.clientX;
            const stepY = gestureStart.lastY - e.clientY;
            gestureStart.lastX = e.clientX;
            gestureStart.lastY = e.clientY;
            lastWheelSent = now;
            if (Math.abs(stepX) > 1 || Math.abs(stepY) > 1) {
              ws.send(JSON.stringify({
                type: 'input',
                action: 'wheel',
                dx: Math.round(stepX * 1.6),
                dy: Math.round(stepY * 1.6)
              }));
            }
          }
        }
      }
    });

    function onPointerEnd(e) {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);

      // Finish drag-to-select range in 'extract' mode!
      if (pointers.size === 0 && gestureStart && gestureMode === 'extract') {
        document.getElementById('drag-sel-box').classList.add('hidden');
        document.getElementById('live-sel-pill').classList.add('hidden');
        const endPt = clientToRemoteCoords(e.clientX, e.clientY);
        if (state.running && endPt) {
          haptic('light');
          if (gestureStart.moved && gestureStart.startRemote) {
            ws.send(JSON.stringify({
              type: 'extract',
              mode: 'range',
              x1: gestureStart.startRemote.x,
              y1: gestureStart.startRemote.y,
              x2: endPt.x,
              y2: endPt.y
            }));
          } else {
            spawnRipple(endPt.localX, endPt.localY, 'extract');
            ws.send(JSON.stringify({
              type: 'extract',
              mode: 'point',
              x: endPt.x,
              y: endPt.y
            }));
          }
        }
        gestureStart = null;
        return;
      }

      if (pointers.size === 0 && gestureStart && !gestureStart.moved && (Date.now() - gestureStart.t) < 500) {
        const pt = clientToRemoteCoords(e.clientX, e.clientY);
        if (pt) {
          if (!ensureTakeoverOrWarn()) {
            gestureStart = null;
            return;
          }
          haptic('light');
          spawnRipple(pt.localX, pt.localY, 'human');
          const now = Date.now();
          const isDbl = (now - lastTapTime) < 280;
          lastTapTime = now;
          ws.send(JSON.stringify({
            type: 'input',
            action: isDbl ? 'dblclick' : 'click',
            x: pt.x,
            y: pt.y
          }));
        }
      }
      if (pointers.size === 0) gestureStart = null;
    }

    stage.addEventListener('pointerup', onPointerEnd);
    stage.addEventListener('pointercancel', onPointerEnd);

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (!state.running || !state.takeover) return;
      const now = Date.now();
      if (now - lastWheelSent >= 40) {
        lastWheelSent = now;
        ws.send(JSON.stringify({
          type: 'input',
          action: 'wheel',
          dx: Math.round(e.deltaX),
          dy: Math.round(e.deltaY)
        }));
      }
    }, { passive: false });

    syncViewportHeight();
    connectWs();
  </script>
</body>
</html>
